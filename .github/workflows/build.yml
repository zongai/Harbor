name: Build Unsigned IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      commit:
        description: '要构建的 commit SHA（留空则构建所选分支的最新提交）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Resolve commit
        id: ref
        run: |
          SHA="${{ github.event.inputs.commit }}"
          SHA="$(echo "$SHA" | tr -d '[:space:]')"
          if [ -z "$SHA" ]; then
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building SHA: ${SHA}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - name: Read app version
        id: ver
        run: |
          MARKETING=$(grep -oE 'MARKETING_VERSION = [^;]+' Harbor.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *//;s/"//g' | tr -d '[:space:]')
          BUILD=$(grep -oE 'CURRENT_PROJECT_VERSION = [^;]+' Harbor.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *//;s/"//g' | tr -d '[:space:]')
          if [ -z "$MARKETING" ]; then MARKETING="0.0"; fi
          if [ -z "$BUILD" ]; then BUILD="0"; fi
          MARKETING=$(echo "$MARKETING" | tr -cd 'A-Za-z0-9._-')
          BUILD=$(echo "$BUILD" | tr -cd 'A-Za-z0-9._-')
          RUN="${{ github.run_number }}"

          # 默认分支构建：文件名附加 -main，与功能分支构建区分
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$DEFAULT_BRANCH" ]; then DEFAULT_BRANCH="main"; fi
          NAME_SUFFIX=""
          git fetch --no-tags origin "$DEFAULT_BRANCH" 2>/dev/null || true
          if git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
            if git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}" 2>/dev/null; then
              NAME_SUFFIX="-main"
            fi
          fi

          IPA_NAME="Harbor-${MARKETING}-${BUILD}-build${RUN}${NAME_SUFFIX}.ipa"
          DISPLAY="v${MARKETING}-${BUILD}-build${RUN}"
          ARTIFACT_NAME="Harbor-ipa-${MARKETING}-${BUILD}-build${RUN}${NAME_SUFFIX}"
          echo "version=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "display=${DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "name_suffix=${NAME_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${DISPLAY} → ${IPA_NAME} (default_branch=${DEFAULT_BRANCH}, suffix='${NAME_SUFFIX}')"

      - name: Inject GitHub build number into AppVersion
        run: |
          RUN="${{ github.run_number }}"
          FILE="Harbor/Models/FeedModels.swift"
          if grep -q 'static let githubBuildNumber: String = ""' "$FILE"; then
            sed -i.bak "s/static let githubBuildNumber: String = \"\"/static let githubBuildNumber: String = \"${RUN}\"/" "$FILE"
            rm -f "${FILE}.bak"
          else
            echo "WARNING: githubBuildNumber placeholder not found in $FILE"
            grep -n 'githubBuildNumber' "$FILE" || true
            exit 1
          fi
          echo "Injected githubBuildNumber=${RUN}"
          grep -n 'githubBuildNumber' "$FILE" | head -3

      - name: Build app (no signing)
        run: |
          xcodebuild -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            INFOPLIST_KEY_HarborGitHubBuild=${{ github.run_number }} \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r "${{ steps.ver.outputs.ipa_name }}" Payload
          ls -lh "${{ steps.ver.outputs.ipa_name }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.ver.outputs.artifact_name }}
          path: ${{ steps.ver.outputs.ipa_name }}

      - name: Generate release notes
        id: notes
        env:
          DISPLAY: ${{ steps.ver.outputs.display }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          git fetch --tags --force origin 2>/dev/null || true

          PREV=""
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV=$(git tag -l 'v*' --sort=-creatordate | sed -n '2p' || true)
          fi
          echo "Previous tag: ${PREV:-<none>}"

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD~30..HEAD"
          fi

          LOG=$(git log --pretty=format:'- %s' "$RANGE" 2>/dev/null \
            | grep -Ev '^(docs: changelog|docs: auto changelog|ci:)' \
            || true)
          if [ -z "$LOG" ]; then
            LOG="- （无新的提交说明）"
          fi

          {
            echo "## ${DISPLAY} — ${DATE}"
            echo ""
            echo "$LOG"
            echo ""
            echo "完整变更见仓库 [CHANGELOG.md](https://github.com/zongai/IosRss/blob/main/CHANGELOG.md)。"
            echo ""
            echo "> README 与 CHANGELOG 由维护者手动更新，CI 不再自动回写。"
          } > /tmp/release_notes.md

          echo "Release notes generated for ${DISPLAY}"
          cat /tmp/release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.ipa_name }}
          tag_name: ${{ steps.ver.outputs.display }}
          name: Harbor ${{ steps.ver.outputs.display }}
          body_path: /tmp/release_notes.md
          generate_release_notes: false
          target_commitish: ${{ steps.ref.outputs.sha }}
